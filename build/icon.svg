<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    MacFlux app icon: a shield with a ">_" prompt (Secure SHell).
    Follows the macOS icon grid: 824x824 rounded square centred on a
    1024x1024 canvas, leaving room for the drop shadow.

    Shadows come from separate black copies drawn underneath. Filtering the
    gradient shapes themselves would posterize them: SVG filters work in
    linear RGB with 8-bit buffers, which visibly bands dark gradients.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26305c"/>
      <stop offset="1" stop-color="#0c1022"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c9eff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="216" x2="0" y2="832" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3c8ff"/>
      <stop offset="1" stop-color="#5a77ee"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="shieldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04060f" flood-opacity="0.55"/>
    </filter>
    <!-- Faint grain that hides 8-bit steps in the dark gradient. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect id="base" x="100" y="100" width="824" height="824" rx="185"/>
    <clipPath id="baseClip">
      <use href="#base"/>
    </clipPath>
    <!-- The round line join (stroke-width 40) softens the shield's corners. -->
    <path id="shieldShape" d="M512 236 C588 286 672 312 744 312 L744 520 C744 662 652 760 512 812
             C372 760 280 662 280 520 L280 312 C352 312 436 286 512 236 Z"/>
  </defs>

  <!-- Base -->
  <use href="#base" fill="#000000" filter="url(#iconShadow)"/>
  <use href="#base" fill="url(#bg)"/>
  <g clip-path="url(#baseClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.05"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Shield -->
  <use href="#shieldShape" fill="#04060f" stroke="#04060f" stroke-width="40"
       stroke-linejoin="round" filter="url(#shieldShadow)"/>
  <use href="#shieldShape" fill="url(#shield)" stroke="url(#shield)" stroke-width="40"
       stroke-linejoin="round"/>

  <!-- Prompt ">_" -->
  <g fill="none" stroke="#141a3c" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="414,434 500,508 414,582"/>
    <line x1="542" y1="582" x2="616" y2="582"/>
  </g>
</svg>
